name: build, test & deploy

on:
  push:
    branches: [main]
  pull_request:

# The build job runs PR-authored code — npm lifecycle scripts and build/*.py — so
# it gets read access and nothing else. The publish scopes live on the deploy job,
# which only ever runs from main.
permissions:
  contents: read

# One publish at a time and never cancel one in flight, but keep the queue per-ref
# so a slow PR build can't hold the production deploy behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # a wedged browser fails in minutes, not at the 6-hour default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # global WebSocket (used by smoke.mjs/og.mjs CDP) needs Node >=21
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - run: npm ci

      - name: Build the app
        run: python3 build/build.py

      - name: Smoke test
        run: node test/smoke.mjs
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Regenerate the social image
        run: node build/og.mjs
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

      # Dev-only tooling must not be able to block an app fix. If Storybook or one of
      # its transitive deps breaks, the app still ships and the workshop is simply
      # absent from that deploy.
      - name: Build the Storybook workshop
        id: storybook
        continue-on-error: true
        run: npm run build-storybook

      - name: Assemble the Pages site
        run: |
          mkdir -p _site
          cp plant-tree.html og.jpg _site/
          cp plant-tree.html _site/index.html          # the app IS the root (no redirect stub)
          cp CNAME robots.txt sitemap.xml _site/        # custom domain + crawler plumbing
          touch _site/.nojekyll

      - name: Add the Storybook workshop
        if: steps.storybook.outcome == 'success'
        run: |
          mkdir -p _site/storybook
          cp -r storybook-static/. _site/storybook/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # only main publishes; PRs stop at the build+test gate above
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Three things can only be checked against the network: whether the canonical
  # host resolves, whether it serves what we just published, and whether the URLs
  # we hand crawlers are reachable. Sprint S shipped a canonical pointing at a
  # domain with no DNS record and the suite stayed green for thirteen days. This
  # job can't prevent that deploy — nothing can, it's the deploy that reveals it —
  # but it turns a silent failure into a red build.
  verify:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # global fetch()

      # rebuilt rather than downloaded: the check must read the canonical this
      # commit claims, so a bad SITE fails here even if the artifact was cached
      - name: Build the app
        run: python3 build/build.py

      - name: Verify the published site
        run: node test/live.mjs
